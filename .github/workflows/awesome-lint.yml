on: 
  workflow_dispatch: 
  push:
    branches: [main]
    paths:
      - 'readme.md'
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: awesome-lint
        run: npx awesome-lint readme.md
      - name: Lychee Broken Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
            args: --suggest --accept 403 './**/*.md' 
